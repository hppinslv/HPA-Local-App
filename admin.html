<!doctype html><html><head><meta charset="utf-8"><title>HPA Admin</title><style>body{font:16px system-ui;background:#f7f4ed;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:32px;border-radius:16px;width:360px;box-shadow:0 10px 35px #0002}label,input,button{display:block;width:100%;box-sizing:border-box}label{margin-top:14px}input{padding:10px;margin-top:6px}button{margin-top:22px;padding:11px;background:#08747b;color:#fff;border:0;border-radius:8px;font-weight:700}#workspace{display:none}#error{color:#a00}</style></head><body><main class="card"><section id="login"><h1>Admin</h1><p>Restricted payroll and IRA tools.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="submit">Sign in</button><p id="error"></p></section><section id="workspace"><h1>IRA Calculator</h1><p>Payroll uploads will use Client IRA as the employee contribution and match it up to 3% of regular pay.</p><p>The upload and multi-month merge screen is next.</p></section></main><script>document.getElementById('submit').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});if(!r.ok){error.textContent='Invalid email or password.';return}login.style.display='none';workspace.style.display='block'};</script></body></html>
